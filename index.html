<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Game Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        textarea { width: 90%; max-width: 500px; height: 100px; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background-color: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0051b3; }
        #game-area { margin-top: 20px; width: 100%; height: 400px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #888; }
    </style>
</head>
<body>
    <h1>Apna Game Banao 🎮</h1>
    <p>Neeche likhein ki aapko kaisa game chahiye (jaise: "Ek game banao jisme balloon phodne hain"):</p>
    
    <textarea id="prompt" placeholder="Yahan apna game ka idea likhein..."></textarea><br>
    <button onclick="generateGame()">Game Generate Karein</button>

    <div id="game-area">Aapka game yahan dikhega...</div>

    <script>
        async function generateGame() {
            const prompt = document.getElementById('prompt').value;
            const gameArea = document.getElementById('game-area');
            
            if (!prompt) {
                alert("Pehle game ka idea likhein!");
                return;
            }

            gameArea.innerHTML = "AI aapka game bana raha hai... Kripya intezaar karein (30-60 seconds)...";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                if (data.code) {
                    gameArea.innerHTML = `<iframe style="width:100%; height:100%; border:none;" srcdoc="${data.code.replace(/"/g, '&quot;')}"></iframe>`;
                } else {
                    gameArea.innerHTML = "Maaf kijiye, game nahi ban paya. Error: " + (data.error || "Unknown");
                }
            } catch (error) {
                gameArea.innerHTML = "Network Error! Kripya check karein ki backend sahi chal raha hai.";
            }
        }
    </script>
</body>
</html>
